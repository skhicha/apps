name: guardianpod
description: GuardianPod / SafetyPod Companion App
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.7.0
  firebase_auth: ^5.3.0
  cloud_firestore: ^5.6.0
  firebase_database: ^11.0.0
  firebase_messaging: ^15.0.0

  # BLE — flutter_blue_plus works with latest Kotlin/AGP
  flutter_blue_plus: ^1.35.3

  # Location + permissions
  geolocator: ^11.0.0
  permission_handler: ^11.3.0

  # Maps (OpenStreetMap — FREE)
  flutter_map: ^6.0.0
  latlong2: ^0.9.1

  # Notifications
  flutter_local_notifications: ^17.0.0

  # UI helpers
  provider: ^6.1.2
  google_fonts: ^6.2.1
  url_launcher: ^6.3.1

  # Utils
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/sounds/siren.mp3