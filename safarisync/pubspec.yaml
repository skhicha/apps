name: safarisync
description: SafariSync - Smart Wildlife Intelligence System v4.0
publish_to: 'none'
version: 4.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Animation
  flutter_animate: ^4.5.0
  google_fonts: ^6.2.1
  provider: ^6.1.2

  # Charts
  fl_chart: ^0.68.0

  # QR Code generation
  qr_flutter: ^4.1.0

  # WebView for payment portal
  webview_flutter: ^4.7.0

  # Firebase — direct integration
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.4
  cloud_firestore: ^5.2.1
  firebase_database: ^11.1.3
  firebase_messaging: ^15.1.0

  # Networking & formatting
  http: ^1.2.1
  intl: ^0.19.0

  url_launcher: ^6.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/track.png
    - assets/safari_map.png